# Phase 2 ablation: cross-view-trained v0 with part weighting = uniform, trained from scratch.
# Identical to configs/v0_dppnet_cv.yaml (= residual) except model.attention.
name: abl_cv_uniform
seeds:
- 0
- 1
- 2
- 3
- 4
data:
  cache: data/cache/casiab_gei.npz
  split: lt
  n_val: 12
  min_frames: 15
model:
  name: dppnet
  hidden_dim: 128
  num_parts: 8
  attention: uniform
train:
  max_episodes: 8000
  lr: 0.001
  wd: 1.0e-05
  n_way: 20
  k_shot: 4
  n_query: 5
  same_view: false
  gallery_seqs: nm_all
  probe_seqs: all
val:
  every: 200
  patience: 12
  n_way: 10
  k_shot: 4
  n_query: 2
  same_view: false
  episodes: 100
  conds:
  - nm
  - bg
  - cl
eval:
- name: sv_20way_4shot
  kind: episodic
  n_way: 20
  k_shot: 4
  n_query: 2
  same_view: true
  episodes: 500
- name: cv_20way_4shot
  kind: episodic
  n_way: 20
  k_shot: 4
  n_query: 2
  same_view: false
  episodes: 500
- name: full_gallery_cv
  kind: full_gallery
  cross_view: true
- name: full_gallery_sv
  kind: full_gallery
  cross_view: false

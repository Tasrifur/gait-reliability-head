# Phase 4 on B1 (v0+BN+aux, cross-view): N1 + N2: per-strip uncertainty + precision-weighted prototype fusion
name: p4_n1n2
seeds:
- 0
- 1
- 2
- 3
- 4
data:
  cache: data/cache/casiab_gei.npz
  split: lt
  n_val: 12
  min_frames: 15
model:
  name: probnet
  encoder: v0bn
  num_parts: 8
  fusion: precision
  logdet_weight: 1.0
  var_init: 4.0
  var_floor: 0.001
train:
  max_episodes: 8000
  lr: 0.001
  wd: 1.0e-05
  n_way: 20
  k_shot: 4
  n_query: 5
  same_view: false
  gallery_seqs: nm_all
  probe_seqs: all
  aux_part_loss: 1.0
val:
  every: 200
  patience: 12
  n_way: 10
  k_shot: 4
  n_query: 2
  same_view: false
  episodes: 100
  conds:
  - nm
  - bg
  - cl
eval:
- name: sv_20way_4shot
  kind: episodic
  n_way: 20
  k_shot: 4
  n_query: 2
  same_view: true
  episodes: 500
- name: cv_20way_4shot
  kind: episodic
  n_way: 20
  k_shot: 4
  n_query: 2
  same_view: false
  episodes: 500
- name: full_gallery_cv
  kind: full_gallery
  cross_view: true
- name: full_gallery_sv
  kind: full_gallery
  cross_view: false
